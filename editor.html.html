<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Houston Sports Live Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; margin: 20px; background:#f9f9f9; }
h1 { color: #ff4500; }
section { border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:6px; background:#fff; }
label { display:block; margin-top:8px; font-weight:bold; }
input, textarea, select { width:100%; padding:6px; margin-top:4px; }
button { margin:4px 0; padding:6px 12px; border:none; border-radius:4px; background-color:#ff4500; color:white; cursor:pointer; }
button:hover { background-color:#e03e00; }
.tab-container, .collapsible-container, .button-container { border:1px dashed #ccc; padding:6px; margin:6px 0; border-radius:4px; }
iframe, audio { width:100%; margin-top:6px; }
</style>
</head>
<body>

<h1>Houston Sports Live - Visual Editor</h1>

<!-- GitHub Credentials -->
<label>GitHub Username:</label>
<input type="text" id="ghUser" placeholder="GitHub username">
<label>Repository Name:</label>
<input type="text" id="ghRepo" placeholder="mobincube-json">
<label>Personal Access Token:</label>
<input type="password" id="ghToken" placeholder="Your GitHub PAT">

<button onclick="loadFromGitHub()">Load JSON from GitHub</button>

<!-- Editor Container -->
<div id="editorContainer"></div>

<!-- JSON Preview & Save -->
<button onclick="generateJSON()">Generate & Preview JSON</button>
<button onclick="saveToGitHub()">Save to GitHub</button>
<textarea id="jsonOutput" style="width:100%;height:200px;margin-top:10px;"></textarea>

<script>
let appData = {
  "pageTitle":"Houston Sports Live",
  "styles":{"primaryColor":"#ff4500","secondaryColor":"#1c1c1c","textColor":"#222","fontFamily":"Arial, sans-serif"},
  "tabs":[
    {"title":"Live Video","paragraphs":["Watch live high school games"],"collapsibles":[{"title":"Basketball Live","content":"<iframe src='https://www.youtube.com/embed/live_stream?channel=CHANNEL_ID' width='100%' height='315' frameborder='0' allowfullscreen></iframe>"}]},
    {"title":"Archived Games","paragraphs":["Replay past games"],"collapsibles":[{"title":"Conroe vs CFISD Basketball","content":"<iframe src='https://www.youtube.com/embed/ARCHIVE_VIDEO_ID' width='100%' height='315' frameborder='0' allowfullscreen></iframe>"}]},
    {"title":"Live Radio","paragraphs":["24/7 Live Radio Stream"],"collapsibles":[{"title":"Radio Stream","content":"<audio controls autoplay><source src='https://yourstreamingurl.com/live.mp3' type='audio/mpeg'>Your browser does not support audio.</audio>"}]},
    {"title":"Schools / Districts","paragraphs":["Select your school to personalize content"],"collapsibles":[{"title":"Conroe High School","content":"Personalized schedules, videos, blogs, notifications"},{"title":"CFISD","content":"Personalized schedules, videos, blogs, notifications"}]},
    {"title":"Blog / News","paragraphs":["High school sports news"],"collapsibles":[{"title":"Conroe HS Highlights","school":"Conroe High School","content":"Recap: Conroe defeats CFISD 72-65. <a href='https://example.com/conroe-game-blog'>Read full article</a>"},{"title":"CFISD Weekly Update","school":"CFISD","content":"CFISD football team dominates the week. <a href='https://example.com/cfisd-blog'>Read full article</a>"}]},
    {"title":"Notifications","paragraphs":["Subscribe for school/district notifications"],"collapsibles":[{"title":"Subscribe Conroe HS","school":"Conroe High School","content":"<button onclick=\"subscribeNotification('Conroe High School')\">Subscribe</button>"},{"title":"Subscribe CFISD","school":"CFISD","content":"<button onclick=\"subscribeNotification('CFISD')\">Subscribe</button>"}]}
  ]
};
let ghSha = '';

function loadFromGitHub(){
  const user = document.getElementById('ghUser').value;
  const repo = document.getElementById('ghRepo').value;
  const token = document.getElementById('ghToken').value;

  fetch(`https://api.github.com/repos/${user}/${repo}/contents/app-content.json`,{
    headers:{'Authorization':'token '+token}
  }).then(r=>r.json()).then(data=>{
    const content = atob(data.content);
    appData = JSON.parse(content);
    ghSha = data.sha;
    renderEditor();
  }).catch(err=>alert('Error loading JSON: '+err));
}

function renderEditor(){
  const container=document.getElementById('editorContainer');
  container.innerHTML='';
  container.innerHTML+=`<section>
    <h2>Page & Styles</h2>
    <label>Page Title</label><input id="pageTitle" value="${appData.pageTitle}">
    <label>Primary Color</label><input type="color" id="primaryColor" value="${appData.styles.primaryColor}">
    <label>Secondary Color</label><input type="color" id="secondaryColor" value="${appData.styles.secondaryColor}">
    <label>Text Color</label><input type="color" id="textColor" value="${appData.styles.textColor}">
    <label>Font Family</label><input id="fontFamily" value="${appData.styles.fontFamily}">
  </section>`;
  appData.tabs.forEach((tab,tIndex)=>{
    const tabSec=document.createElement('section'); tabSec.className='tab-container';
    tabSec.innerHTML=`<h2>Tab ${tIndex+1}</h2><label>Title</label><input class="tabTitle" value="${tab.title}"><button onclick="addParagraph(${tIndex})">Add Paragraph</button><button onclick="addCollapsible(${tIndex})">Add Collapsible</button><button onclick="addButton(${tIndex})">Add Button</button>`;
    tab.paragraphs=tab.paragraphs||[]; tab.paragraphs.forEach((p,pIndex)=>{
      const pDiv=document.createElement('div'); pDiv.innerHTML=`<label>Paragraph ${pIndex+1}</label><textarea class="paragraph">${p}</textarea><button onclick="removeParagraph(${tIndex},${pIndex})">Remove</button>`;
      tabSec.appendChild(pDiv);
    });
    tab.collapsibles=tab.collapsibles||[]; tab.collapsibles.forEach((c,cIndex)=>{
      const cDiv=document.createElement('div'); cDiv.className='collapsible-container';
      cDiv.innerHTML=`<label>Collapsible Title</label><input class="collapsibleTitle" value="${c.title}"><label>Content</label><textarea class="collapsibleContent">${c.content}</textarea><button onclick="removeCollapsible(${tIndex},${cIndex})">Remove</button>`;
      tabSec.appendChild(cDiv);
    });
    tab.buttons=tab.buttons||[]; tab.buttons.forEach((b,bIndex)=>{
      const bDiv=document.createElement('div'); bDiv.className='button-container';
      bDiv.innerHTML=`<label>Button Text</label><input class="buttonText" value="${b.text}"><label>Link</label><input class="buttonLink" value="${b.link}"><label>External</label><select class="buttonExternal"><option value="true" ${b.external?'selected':''}>Yes</option><option value="false" ${!b.external?'selected':''}>No</option></select><button onclick="removeButton(${tIndex},${bIndex})">Remove</button>`;
      tabSec.appendChild(bDiv);
    });
    container.appendChild(tabSec);
  });
  container.innerHTML+=`<button onclick="addTab()">Add Tab</button>`;
}

function generateJSON(){
  appData.pageTitle=document.getElementById('pageTitle').value;
  appData.styles={primaryColor:document.getElementById('primaryColor').value,secondaryColor:document.getElementById('secondaryColor').value,textColor:document.getElementById('textColor').value,fontFamily:document.getElementById('fontFamily').value};
  document.querySelectorAll('.tab-container').forEach((tabSec,tIndex)=>{
    const tab=appData.tabs[tIndex]; tab.title=tabSec.querySelector('.tabTitle').value;
    tab.paragraphs=Array.from(tabSec.querySelectorAll('.paragraph')).map(p=>p.value);
    tab.collapsibles=Array.from(tabSec.querySelectorAll('.collapsible-container')).map(c=>({title:c.querySelector('.collapsibleTitle').value,content:c.querySelector('.collapsibleContent').value}));
    tab.buttons=Array.from(tabSec.querySelectorAll('.button-container')).map(b=>({text:b.querySelector('.buttonText').value,link:b.querySelector('.buttonLink').value,external:b.querySelector('.buttonExternal').value==='true'}));
  });
  document.getElementById('jsonOutput').value=JSON.stringify(appData,null,2);
}

async function saveToGitHub(){
  generateJSON();
  const user=document.getElementById('ghUser').value;
  const repo=document.getElementById('ghRepo').value;
  const token=document.getElementById('ghToken').value;
  const content=btoa(unescape(encodeURIComponent(document.getElementById('jsonOutput').value)));
  const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/app-content.json`,{
    method:'PUT',headers:{'Authorization':'token '+token},
    body:JSON.stringify({message:'Update from Visual Editor',content:content,sha:ghSha})
  });
  const result=await res.json();
  if(result.content){ alert('Saved to GitHub successfully!'); ghSha=result.content.sha; } else { alert('Error: '+JSON.stringify(result)); }
}

// Add/remove helpers
function addTab(){ appData.tabs.push({title:'New Tab',paragraphs:[],collapsibles:[],buttons:[]}); renderEditor(); }
function addParagraph(tIndex){ appData.tabs[tIndex].paragraphs.push('New paragraph'); renderEditor(); }
function removeParagraph(tIndex,pIndex){ appData.tabs[tIndex].paragraphs.splice(pIndex,1); renderEditor(); }
function addCollapsible(tIndex){ appData.tabs[tIndex].collapsibles.push({title:'New',content:'Content'}); renderEditor(); }
function removeCollapsible(tIndex,cIndex){ appData.tabs[tIndex].collapsibles.splice(cIndex,1); renderEditor(); }
function addButton(tIndex){ appData.tabs[tIndex].buttons.push({text:'Button',link:'#',external:false}); renderEditor(); }
function removeButton(tIndex,bIndex){ appData.tabs[tIndex].buttons.splice(bIndex,1); renderEditor(); }

// Notification placeholder function
function subscribeNotification(school){ alert('Subscribed to notifications for '+school); }

</script>

</body>
</html>
